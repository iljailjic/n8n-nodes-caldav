name: iCloud E2E (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_live_icloud_e2e:
        description: Confirm that this run may access the dedicated iCloud E2E calendar.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fake-dry-run:
    if: github.ref == 'refs/heads/main' && inputs.confirm_live_icloud_e2e == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run fake iCloud E2E dry run
        run: npm run test:e2e:icloud:dry-run

  prepare:
    if: github.ref == 'refs/heads/main' && inputs.confirm_live_icloud_e2e == true
    needs: fake-dry-run
    runs-on: ubuntu-latest
    outputs:
      calendar_scope_sha256: ${{ steps.calendar-scope.outputs.calendar_scope_sha256 }}

    steps:
      - name: Derive calendar scope digest
        id: calendar-scope
        env:
          CALDAV_ICLOUD_E2E_CALENDAR_DISPLAY_NAME: ${{ vars.CALDAV_ICLOUD_E2E_CALENDAR_DISPLAY_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${CALDAV_ICLOUD_E2E_CALENDAR_DISPLAY_NAME}" ]; then
            echo 'The dedicated calendar selector is required.' >&2
            exit 1
          fi
          calendar_scope_sha256="$(printf 'calendar-display-name:%s' "$CALDAV_ICLOUD_E2E_CALENDAR_DISPLAY_NAME" | sha256sum | awk '{print $1}')"
          printf 'calendar_scope_sha256=%s\n' "$calendar_scope_sha256" >> "$GITHUB_OUTPUT"

  live:
    if: github.ref == 'refs/heads/main' && inputs.confirm_live_icloud_e2e == true
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: icloud-e2e-${{ needs.prepare.outputs.calendar_scope_sha256 }}
      cancel-in-progress: false
    env:
      CALDAV_ICLOUD_E2E_SERVER_URL: ${{ secrets.CALDAV_ICLOUD_E2E_SERVER_URL }}
      CALDAV_ICLOUD_E2E_USERNAME: ${{ secrets.CALDAV_ICLOUD_E2E_USERNAME }}
      CALDAV_ICLOUD_E2E_APP_PASSWORD: ${{ secrets.CALDAV_ICLOUD_E2E_APP_PASSWORD }}
      CALDAV_ICLOUD_E2E_CALENDAR_DISPLAY_NAME: ${{ vars.CALDAV_ICLOUD_E2E_CALENDAR_DISPLAY_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recheck calendar scope digest
        env:
          EXPECTED_CALENDAR_SCOPE_SHA256: ${{ needs.prepare.outputs.calendar_scope_sha256 }}
        run: |
          set -euo pipefail
          actual_calendar_scope_sha256="$(printf 'calendar-display-name:%s' "$CALDAV_ICLOUD_E2E_CALENDAR_DISPLAY_NAME" | sha256sum | awk '{print $1}')"
          test "$actual_calendar_scope_sha256" = "$EXPECTED_CALENDAR_SCOPE_SHA256"

      - name: Run opt-in iCloud E2E suite
        env:
          CALDAV_ICLOUD_E2E_OPT_IN: '1'
        run: npm run test:e2e:icloud
