name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write
  issues: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Validate release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="$(node --print "require('./package.json').version")"
          package_name="$(node --print "require('./package.json').name")"
          repository_url="$(node --print "require('./package.json').repository.url")"

          if [[ "$package_name" != "@iljailjic/n8n-nodes-caldav" ]]; then
            echo "Unexpected package name: $package_name" >&2
            exit 1
          fi

          if [[ "$repository_url" != "git+https://github.com/iljailjic/n8n-nodes-caldav.git" ]]; then
            echo "Unexpected repository URL: $repository_url" >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable versions from 1.0.0 onward may be published: $version" >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi

          if [[ "$IS_PRERELEASE" != "false" ]]; then
            echo "Prereleases are not published by this workflow" >&2
            exit 1
          fi

          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a section for $version" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $RELEASE_TAG does not point to a commit in main" >&2
            exit 1
          fi

          milestones="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/milestones?state=all&per_page=100"
          )"
          milestone_count="$(
            jq --arg version "$version" \
              '[.[][] | select(.title == $version)] | length' \
              <<<"$milestones"
          )"
          milestone_state="$(
            jq -r --arg version "$version" \
              '[.[][] | select(.title == $version)][0].state // "missing"' \
              <<<"$milestones"
          )"

          if [[ "$milestone_count" != "1" || "$milestone_state" != "closed" ]]; then
            echo "Milestone $version must exist exactly once and be closed" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm exec -- prettier --check .

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release
