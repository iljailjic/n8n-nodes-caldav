name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.tag_name != 'v1.0.0-beta.2'
    name: Publish reviewed archive to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Validate tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/release-gate.mjs metadata publish "$RELEASE_TAG"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$RUNNER_TEMP/release.json"
          node scripts/release-gate.mjs release publish "$RELEASE_TAG" "$RUNNER_TEMP/release.json"

      - name: Download and verify reviewed archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          archive="iljailjic-n8n-nodes-caldav-${RELEASE_TAG#v}.tgz"
          mkdir -p "$RUNNER_TEMP/release-archive"
          gh release download "$RELEASE_TAG" --pattern "$archive" --dir "$RUNNER_TEMP/release-archive"
          gh release download "$RELEASE_TAG" --pattern "$archive.sha256" --dir "$RUNNER_TEMP/release-archive"
          node scripts/release-gate.mjs archive "$RELEASE_TAG" "$RUNNER_TEMP/release-archive/$archive" "$RUNNER_TEMP/release-archive/$archive.sha256" "$RUNNER_TEMP/release.json"

      - name: Install release guard
        run: npm ci

      - name: Publish exact archive with OIDC provenance
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_MODE: 'true'
        run: |
          set -euo pipefail
          npm run prepublishOnly
          archive="$RUNNER_TEMP/release-archive/iljailjic-n8n-nodes-caldav-${RELEASE_TAG#v}.tgz"
          dist_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then dist_tag=next; fi
          npm publish "$archive" --provenance --access public --tag "$dist_tag"
